<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" style="stop-color:#12B98D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A7F60;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- 屋顶（加粗描边，小尺寸下依旧锐利） -->
  <path d="M14 31 L32 16 L50 31" stroke="#ffffff" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 房体 -->
  <path d="M19 30 V47 H45 V30" stroke="#ffffff" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 门/账本块：实心高对比，替代易发糊的微型线条 -->
  <rect x="27" y="35" width="10" height="12" rx="2" fill="#ffffff"/>
</svg>
